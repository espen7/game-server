syntax = "proto3";

package game.engine.core.proto;

option java_package = "game.engine.core.proto";
option java_outer_classname = "CommonProto";

message Letter {
  int32 msg_id = 1;
  bytes payload = 2;
}

message Envelope {
  Letter letter = 1;
  string player_id = 2;
  string gateway_id = 3;
  int64 timestamp = 4;
}
